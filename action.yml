name: "losslint"
description: >-
  Lint your training logs after the run: NaN, divergence, loss spikes,
  overfitting onset and step bugs in trainer_state.json / CSV / JSONL /
  TensorBoard event files, with CI-friendly exit codes.
branding:
  icon: "activity"
  color: "purple"

inputs:
  files:
    description: "Whitespace-separated log files or directories to lint"
    required: true
    default: "runs/"
  fail-severity:
    description: "Exit 1 when a finding is at or above this severity (error/warning/info)"
    required: false
    default: "error"
  report-path:
    description: "Path for the JSON report (relative to the workspace)"
    required: false
    default: "losslint-report.json"

outputs:
  report-path:
    description: "Path to the generated JSON report"
    value: ${{ steps.lint.outputs.report-path }}

runs:
  using: "composite"
  steps:
    - name: Install losslint from this action revision
      shell: bash
      run: python -m pip install "${GITHUB_ACTION_PATH}[tb]"
    - name: Lint training logs
      id: lint
      shell: bash
      run: |
        read -r -a files <<< "${{ inputs.files }}"
        set +e
        losslint check "${files[@]}" --fail-severity "${{ inputs.fail-severity }}" \
          --format github --json-out "${{ inputs.report-path }}"
        result=$?
        losslint check "${files[@]}" --format markdown >> "$GITHUB_STEP_SUMMARY"
        echo "report-path=${{ inputs.report-path }}" >> "$GITHUB_OUTPUT"
        exit "$result"
