name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p logs
          printf '{"step": 1, "loss": 1.0}\n{"step": 2, "loss": 0.9}\n' > logs/metrics.jsonl
      - uses: .
        id: losslint
        with:
          files: logs/metrics.jsonl
          fail-severity: error
          report-path: reports/losslint.json
      - run: test -f "${{ steps.losslint.outputs.report-path }}"
